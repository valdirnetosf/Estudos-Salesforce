<template>
    <lightning-card title="Busca de CEP" icon-name="utility:location">
        <div class="slds-p-around_medium">

            <lightning-combobox
                name="modoOperacao"
                label="Modo de operação"
                placeholder="Escolha LWC ou Apex"
                options={opcoesModoOperacao}
                value={modoOperacao}
                onchange={handleMudancaOperacao}>
            </lightning-combobox>

            <lightning-combobox
                name="modoBusca"
                label="O que você quer fazer?"
                placeholder="Selecione uma opção..."
                options={opcoesModo}
                value={modoBusca}
                onchange={handleMudancaModo}>
            </lightning-combobox>

         
            <template lwc:if={mostrarBlocoCep}>
                <div class="slds-p-top_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_8-of-12">
                            <lightning-input
                                type="text"
                                label="CEP"
                                placeholder="Digite o CEP (ex: 01310-100)"
                                value={cepDigitado}
                                maxlength="9"
                                onchange={handleCepChange}
                                onkeypress={handleCepKeyPress}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_4-of-12" style="padding-top: 1.75rem;">
                            <lightning-button
                                label="Pesquisar"
                                onclick={handleBuscarCep}
                                variant="brand"
                                class="slds-p-left_small">
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            
            <template lwc:if={mostrarBlocoEndereco}>
                <div class="slds-p-top_medium">

                    
                    <lightning-input
                        type="text"
                        label="Nome da Rua"
                        placeholder="Ex: Avenida Paulista"
                        value={ruaDigitada}
                        onchange={handleRuaChange}
                        onkeypress={handleEnderecoKeyPress}>
                    </lightning-input>

                    <div class="slds-grid slds-gutters slds-p-top_small">

                        <div class="slds-col slds-size_2-of-3">
                            
                            <lightning-input
                                type="text"
                                label="Cidade"
                                placeholder="Ex: São Paulo"
                                value={cidadeDigitada}
                                onchange={handleCidadeChange}
                                onkeypress={handleEnderecoKeyPress}>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-3">
                            
                            <lightning-combobox
                                name="uf"
                                label="UF"
                                placeholder="UF"
                                options={opcoesUF}
                                value={ufSelecionada}
                                onchange={handleUFChange}>
                            </lightning-combobox>
                        </div>

                    </div>

                    <div class="slds-p-top_medium">
                        <lightning-button
                            label="Pesquisar"
                            onclick={handleBuscarEndereco}
                            variant="brand"
                            disabled={notPodeBuscarPorEndereco}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={erro}>
                <div class="slds-text-color_error slds-p-top_medium">{erro}</div>
            </template>

            <template if:true={enderecos}>
                <template for:each={enderecos} for:item="item">
                    <div key={item.cep} class="slds-box slds-m-top_small">
                        <p><strong>CEP:</strong> {item.cep}</p>
                        <p><strong>Logradouro:</strong> {item.logradouro}</p>
                        <p><strong>Bairro:</strong> {item.bairro}</p>
                        <p><strong>Localidade:</strong> {item.localidade} / {item.uf}</p>
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
