<template>

    <lightning-card
        title="Busca CEP"
        icon-name="utility:location">

        <div class="slds-p-around_medium">

            <!-- MODO DE OPERAÇÃO -->

            <lightning-combobox
                name="modoOperacao"
                label="Modo de Operação"
                placeholder="Selecione APEX ou JavaScript"
                options={opcoesModoOperacao}
                value={modoOperacao}
                onchange={handleMudancaOperacao}>
            </lightning-combobox>

            <!-- TIPO DE BUSCA -->

            <lightning-combobox
                name="modoBusca"
                label="Tipo de Busca"
                placeholder="Selecione uma opção"
                options={opcoesModo}
                value={modoBusca}
                onchange={handleMudancaModo}>
            </lightning-combobox>

            <!-- Busca Cep -->

            <template lwc:if={mostrarBlocoCep}>

                <div class="slds-p-top_medium">

                    <lightning-input
                        type="text"
                        label="CEP"
                        placeholder="Ex: 60160150"
                        value={cepDigitado}
                        maxlength="8"
                        onchange={handleCepChange}
                        onkeydown={handleCepKeyDown}>
                    </lightning-input>

                </div>

            </template>

            <!-- Busca Endereço -->

            <template lwc:if={mostrarBlocoEndereco}>

                <div class="slds-p-top_medium">

                    <lightning-input
                        type="text"
                        label="Rua"
                        placeholder="Ex: Avenida Paulista"
                        value={ruaDigitada}
                        onchange={handleRuaChange}
                        onkeydown={handleEnderecoKeyDown}>
                    </lightning-input>

                    <div class="slds-grid slds-gutters slds-p-top_small">

                        <div class="slds-col slds-size_2-of_3">

                            <lightning-input
                                type="text"
                                label="Cidade"
                                placeholder="Ex: Fortaleza"
                                value={cidadeDigitada}
                                onchange={handleCidadeChange}
                                onkeydown={handleEnderecoKeyDown}>
                            </lightning-input>

                        </div>

                        <div class="slds-col slds-size_1-of_3">

                            <lightning-combobox
                                label="UF"
                                value={ufSelecionada}
                                options={opcoesUF}
                                onchange={handleUFChange}>
                            </lightning-combobox>

                        </div>

                    </div>

                </div>

            </template>

            <!-- ERRO -->

            <template if:true={erro}>

                <div class="slds-text-color_error slds-p-top_medium">

                    {erro}

                </div>

            </template>

            <!-- Resultados -->

            <template if:true={temEnderecos}>

                <template
                    for:each={enderecos}
                    for:item="item"
                    for:index="index">

                    <div
                        key={item.cep}
                        class="slds-box slds-m-top_small">

                        <p>
                            <strong>CEP:</strong>
                            {item.cep}
                        </p>

                        <p>
                            <strong>Logradouro:</strong>
                            {item.logradouro}
                        </p>

                        <p>
                            <strong>Bairro:</strong>
                            {item.bairro}
                        </p>

                        <p>
                            <strong>Cidade:</strong>
                            {item.localidade}
                        </p>

                        <p>
                            <strong>UF:</strong>
                            {item.uf}
                        </p>

                        <lightning-button
                            label="Selecionar Endereço"
                            data-index={index}
                            onclick={handleSelecionarEndereco}
                            variant="brand"
                            class="slds-m-top_small">
                        </lightning-button>

                    </div>

                </template>

            </template>

            <!-- Parâmetros do Flow -->

            <template if:true={flowCep}>

                <div
                    class="slds-box
                           slds-theme_success
                           slds-m-top_medium">

                    <p>
                        <strong>
                            Dados enviados para o Flow
                        </strong>
                    </p>

                    <p>CEP: {flowCep}</p>

                    <p>
                        Logradouro:
                        {flowLogradouro}
                    </p>

                    <p>
                        Bairro:
                        {flowBairro}
                    </p>

                    <p>
                        Cidade:
                        {flowCidade}
                    </p>

                    <p>
                        UF:
                        {flowUf}
                    </p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
